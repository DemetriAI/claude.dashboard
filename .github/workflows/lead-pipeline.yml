# Lead pipeline — weekly fresh leads + heartbeat
#
# HONEST NOTES (read before relying on this for "24/7"):
#  * GitHub runs scheduled workflows ONLY on a repo's DEFAULT branch. Keep this
#    repo's default branch set to `main` (where this file lives) or the cron
#    will never fire.
#  * It needs an ANTHROPIC_API_KEY repo secret (Settings > Secrets > Actions)
#    for the Claude step that generates NEW leads. Each run spends API tokens —
#    that is the real cost of an always-on engine.
#  * TEST IT FIRST: after adding the secret, click "Run workflow"
#    (workflow_dispatch) once and watch it go green before trusting the cron.
#  * Failures: GitHub emails the workflow file's last committer automatically,
#    and the run shows red in the Actions tab. Silence + a fresh STATUS.md
#    timestamp = healthy.

name: lead-pipeline

on:
  workflow_dispatch: {}            # one-click manual run (use this to test)
  schedule:
    - cron: "0 13 * * 1"           # Mondays ~06:00 America/Phoenix (13:00 UTC)

permissions:
  contents: write                  # commit refreshed leads + heartbeat

concurrency:
  group: lead-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Zero-cost heartbeat refresh over existing data (runs first so the
      # pipeline is always exercised even before the Claude step).
      - name: Refresh heartbeat
        working-directory: leads
        run: python3 score_leads.py

      # The real engine: generate fresh leads to refill cold slots.
      # Verify the action version/inputs against current docs if it errors:
      # https://code.claude.com/docs/en/claude-code-on-the-web
      - name: Generate fresh leads with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Refresh leads/ for the Phoenix metro. Re-run discovery + enrichment
            to refill the lowest-fit (cold) slots with fresh, non-duplicate warm
            prospects, then regenerate the CSVs with score_leads.py so STATUS.md
            and the per-vertical files stay current. Rules: independent,
            owner-operated businesses only; no fabricated data; every lead keeps
            a verified phone, website, and source URL.

      - name: Commit refreshed leads + status
        run: |
          git config user.name  "lead-pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads/STATUS.md leads/_status.json leads/*_phoenix_az.csv leads/raw
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly lead pipeline run [skip ci]"
            # Push explicitly to the triggering branch: scheduled runs check out
            # a detached HEAD, so a bare `git push` would fail.
            git push origin "HEAD:${{ github.ref_name }}"
          fi
